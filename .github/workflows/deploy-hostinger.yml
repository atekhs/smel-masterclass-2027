name: Deploy to Hostinger

# Uploads the site to https://afroindustrygroup.africa/smelretreat/ over FTP
# whenever main changes. Needs three repository secrets:
#   FTP_SERVER    e.g. ftp.afroindustrygroup.africa (or the IP shown in hPanel)
#   FTP_USERNAME  an FTP account whose directory is public_html/smelretreat
#   FTP_PASSWORD  that account's password
# Until FTP_SERVER is set, the upload step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Server and username may be stored as secrets or as plain variables.
      FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      HAS_PASSWORD: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP settings (yes/no only, values are never printed)
        run: |
          echo "FTP_SERVER found:   $([ -n "$FTP_SERVER" ] && echo yes || echo NO)"
          echo "FTP_USERNAME found: $([ -n "$FTP_USERNAME" ] && echo yes || echo NO)"
          echo "FTP_PASSWORD found: $([ "$HAS_PASSWORD" = "true" ] && echo yes || echo NO)"
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ "$HAS_PASSWORD" != "true" ]; then
            echo "::warning::FTP settings incomplete, so nothing was uploaded. Add them under Settings > Secrets and variables > Actions > Secrets > New repository secret."
          fi

      - name: Upload site over FTP
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.HAS_PASSWORD == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
