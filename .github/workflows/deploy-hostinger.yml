name: Deploy to Hostinger

# Uploads the site to https://afroindustrygroup.africa/smelretreat/ over FTP
# whenever main changes. Needs three repository secrets:
#   FTP_SERVER    e.g. ftp.afroindustrygroup.africa (or the IP shown in hPanel)
#   FTP_USERNAME  an FTP account whose directory is public_html/smelretreat
#   FTP_PASSWORD  that account's password
# Until FTP_SERVER is set, the upload step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip until FTP secrets are added
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret not set yet, so nothing was uploaded."

      - name: Upload site over FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
